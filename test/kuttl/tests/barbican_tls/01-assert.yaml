#
# Check for:
#
# - Deployment with tls volumes
#
apiVersion: barbican.openstack.org/v1beta1
kind: Barbican
metadata:
  name: barbican
spec:
  serviceUser: barbican
  customServiceConfig: |
    [DEFAULT]
    debug = True
  databaseInstance: openstack
  databaseAccount: barbican
  messagingBus:
    cluster: rabbitmq
  barbicanWorker:
    replicas: 1
  barbicanKeystoneListener:
    replicas: 1
  barbicanAPI:
    tls:
      api:
        internal:
          secretName: cert-barbican-internal-svc
        public:
          secretName: cert-barbican-public-svc
      caBundleSecretName: combined-ca-bundle
    replicas: 1
---
apiVersion: barbican.openstack.org/v1beta1
kind: BarbicanAPI
metadata:
  name: barbican-api
spec:
  tls:
    api:
      internal:
        secretName: cert-barbican-internal-svc
      public:
        secretName: cert-barbican-public-svc
    caBundleSecretName: combined-ca-bundle
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: barbican-api
spec:
  replicas: 1
  selector:
    matchLabels:
      component: barbican-api
      service: barbican
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        component: barbican-api
        service: barbican
    spec:
      containers:
        - args:
            - --single-child
            - --
            - /usr/bin/tail
            - -n+1
            - -F
            - /var/log/barbican/barbican-api.log
          command:
            - /usr/bin/dumb-init
          name: barbican-api-log
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthcheck
              port: 9311
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 5
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 42403
            runAsNonRoot: true
            runAsUser: 42403
            seccompProfile:
              type: RuntimeDefault
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /var/log/barbican
              name: logs
        - command:
            - /usr/sbin/httpd
          args:
            - -DFOREGROUND
          name: barbican-api
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthcheck
              port: 9311
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 5
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 42403
            runAsNonRoot: true
            runAsUser: 42403
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /etc/my.cnf
              name: config-data
              readOnly: true
              subPath: my.cnf
            - mountPath: /etc/barbican/barbican.conf.d
              name: config-data-custom
              readOnly: true
            - mountPath: /var/log/barbican
              name: logs
            - mountPath: /etc/httpd/conf/httpd.conf
              name: config-data
              readOnly: true
              subPath: httpd.conf
            - mountPath: /etc/httpd/conf.modules.d/mime.conf
              name: config-data
              readOnly: true
              subPath: mime.conf
            - mountPath: /etc/httpd/conf.d/ssl.conf
              name: config-data
              readOnly: true
              subPath: ssl.conf
            - mountPath: /etc/httpd/conf.d/10-barbican_wsgi_main.conf
              name: config-data
              readOnly: true
              subPath: 10-barbican_wsgi_main.conf
            - mountPath: /var/www/cgi-bin/barbican/main
              name: config-data
              readOnly: true
              subPath: main
            - mountPath: /run/httpd
              name: run-httpd
            - mountPath: /var/log/httpd
              name: var-log-httpd
            - mountPath: /etc/barbican/optional_policy.json
              name: config-data-custom
              readOnly: true
              subPath: optional_policy.json
            - mountPath: /etc/barbican/policy.json
              name: config-data-custom
              readOnly: true
              subPath: policy.json
            - mountPath: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
              name: combined-ca-bundle
              readOnly: true
              subPath: tls-ca-bundle.pem
            - mountPath: /etc/pki/tls/certs/internal.crt
              name: internal-tls-certs
              readOnly: true
              subPath: tls.crt
            - mountPath: /etc/pki/tls/private/internal.key
              name: internal-tls-certs
              readOnly: true
              subPath: tls.key
            - mountPath: /etc/pki/tls/certs/public.crt
              name: public-tls-certs
              readOnly: true
              subPath: tls.crt
            - mountPath: /etc/pki/tls/private/public.key
              name: public-tls-certs
              readOnly: true
              subPath: tls.key
      volumes:
        - name: config-data
          secret:
            defaultMode: 416
            secretName: barbican-config-data
        - name: config-data-custom
          secret:
            defaultMode: 416
            secretName: barbican-api-config-data
        - emptyDir: {}
          name: logs
        - emptyDir: {}
          name: run-httpd
        - emptyDir: {}
          name: var-log-httpd
        - name: combined-ca-bundle
          secret:
            defaultMode: 292
            secretName: combined-ca-bundle
        - name: internal-tls-certs
          secret:
            defaultMode: 256
            secretName: cert-barbican-internal-svc
        - name: public-tls-certs
          secret:
            defaultMode: 256
            secretName: cert-barbican-public-svc
status:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: barbican-keystone-listener
  ownerReferences:
    - apiVersion: barbican.openstack.org/v1beta1
      blockOwnerDeletion: true
      controller: true
      kind: BarbicanKeystoneListener
      name: barbican-keystone-listener
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: barbican-worker
  ownerReferences:
    - apiVersion: barbican.openstack.org/v1beta1
      blockOwnerDeletion: true
      controller: true
      kind: BarbicanWorker
      name: barbican-worker
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
namespaced: true
commands:
  - script: |
      template='{{.status.apiEndpoint.internal}}{{":"}}{{.status.apiEndpoint.public}}{{"\n"}}'
      regex="https:\/\/barbican-internal.$NAMESPACE.*:https:\/\/barbican-public.$NAMESPACE.*"
      apiEndpoints=$(oc get -n $NAMESPACE BarbicanAPI barbican-api -o go-template="$template")
      matches=$(echo "$apiEndpoints" | sed -e "s?$regex??")
      if [ -z "$matches" ]; then
        exit 0
      else
        exit 1
      fi
